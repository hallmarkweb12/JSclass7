<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let time = new Date().getHours();
        let greeting;

        if(time<12){
            greeting = "GOOD MORNING";
        }
        else if(time<19){
            greeting = "GOOD AFTERNOON";
        }
        else{
            greeting = "GOOD NIGHT";
        }
        document.write(greeting);
    </script>
</body>
</html>
